# Local development database: Postgres 16 with pgvector.
#   docker compose up -d
# Then set DATABASE_URL=postgresql://assistant:assistant@localhost:5432/assistant in .env
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: assistant
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant"]
      interval: 5s
      retries: 10

volumes:
  db-data:
